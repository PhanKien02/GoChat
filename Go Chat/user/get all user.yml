info:
  name: get all user
  type: http
  seq: 4

http:
  method: get
  url: "{{BASE_URL}}/users?searchKeyword=soi&page=1&limit"
  params:
    - name: searchKeyword
      value: soi
      type: query
    - name: page
      value: "1"
      type: query
    - name: limit
      value: ""
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
